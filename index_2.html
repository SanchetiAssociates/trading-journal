<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIAS Trading Journal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg:#f7f7f5;--surface:#fff;--border:#e6e4de;--text:#181816;--muted:#6b6b68;
  --green:#2a7a3b;--green-bg:#eef7f0;--green-border:#b8dfc0;
  --red:#a0251e;--red-bg:#fdf0ef;--red-border:#f0b8b5;
  --amber:#8a5c00;--amber-bg:#fdf5e6;
  --blue:#1a4f8a;--blue-bg:#edf4fc;
  --gemini-bg:#e8f0fe;--gemini:#1a56a0;
  --claude-bg:#fff0e6;--claude:#8a4000;
  --nias-bg:#f3e8ff;--nias:#6b21a8;
  --r:8px;--rl:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.tlogo{font-size:15px;font-weight:600}.tlogo span{color:var(--green)}
.ttag{font-size:11px;background:var(--nias-bg);color:var(--nias);padding:2px 8px;border-radius:4px;font-weight:500;margin-left:10px}
.tupd{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.main{max-width:960px;margin:0 auto;padding:28px 20px 80px}
.loading{text-align:center;padding:80px;color:var(--muted)}
.err{background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--r);padding:16px 20px;font-size:13px;color:var(--red);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.mc .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.mc .v{font-size:20px;font-weight:600;font-family:'JetBrains Mono',monospace}
.mc .s{font-size:11px;color:var(--muted);margin-top:2px}
.mc .v.pos{color:var(--green)}.mc .v.neg{color:var(--red)}.mc .v.amb{color:var(--amber)}
.rb{background:var(--bg);border-radius:3px;height:4px;margin-top:6px;overflow:hidden}
.rf{height:100%;border-radius:3px}
.src-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.si{padding:8px 14px;border-radius:var(--r);border:1px solid;font-size:12px}
.si.g{background:var(--gemini-bg);border-color:#b3ccf5;color:var(--gemini)}
.si.c{background:var(--claude-bg);border-color:#f0c8a0;color:var(--claude)}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px 20px;margin-bottom:22px}
.chart-box .ct{font-size:13px;font-weight:500;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:75px}
.bar{flex:1;border-radius:3px 3px 0 0;min-height:4px;cursor:pointer;transition:.15s}
.bar:hover{opacity:.75}
.bar.pos{background:var(--green-bg);border:1px solid var(--green-border)}
.bar.neg{background:var(--red-bg);border:1px solid var(--red-border)}
.blabels{display:flex;gap:6px;margin-top:4px}
.blabels span{flex:1;font-size:10px;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:12px}
.tab{padding:7px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--green);color:var(--green)}
.tab.on{background:var(--text);color:#fff;border-color:var(--text)}
.tab .tp{font-size:11px;margin-left:6px;font-family:'JetBrains Mono',monospace}
.tab .tp.pos{color:var(--green)}.tab .tp.neg{color:var(--red)}
.tab.on .tp{color:#9aefab}.tab.on .tp.neg{color:#ffa9a9}
.ctx{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.cp{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface)}
.cp.al{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.cp.mo{background:var(--amber-bg);border-color:#e8c870;color:var(--amber)}
.cp.ok{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.ds{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:18px}
.dc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.dc .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.dc .v{font-size:17px;font-weight:600;font-family:'JetBrains Mono',monospace}
.dc .v.pos{color:var(--green)}.dc .v.neg{color:var(--red)}
.stitle{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:500;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.tc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:14px;overflow:hidden}
.tch{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 18px 12px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.tchl{display:flex;align-items:center;gap:12px}
.tci{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.tci.win{background:var(--green-bg);color:var(--green)}.tci.loss{background:var(--red-bg);color:var(--red)}.tci.sp{background:var(--amber-bg);color:var(--amber)}
.tcn{font-size:15px;font-weight:600}.tcs{font-size:12px;color:var(--muted);margin-top:1px}
.tcp .v{font-size:20px;font-weight:600;font-family:'JetBrains Mono',monospace;text-align:right}
.tcp .v.pos{color:var(--green)}.tcp .v.neg{color:var(--red)}
.tcp .s{font-size:11px;color:var(--muted);text-align:right}
.tw{overflow-x:auto}
table.lt{width:100%;border-collapse:collapse;font-size:12px}
table.lt th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:500;padding:7px 14px;text-align:left;background:var(--bg);border-bottom:1px solid var(--border)}
table.lt td{padding:9px 14px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace}
table.lt tr:last-child td{border-bottom:none}
table.lt tr.tot td{border-top:2px solid var(--border);font-weight:600;background:var(--bg)}
.ab{color:var(--green);font-weight:600}.as{color:var(--red);font-weight:600}
.pp{color:var(--green);font-weight:600}.pn{color:var(--red);font-weight:600}.pm{color:var(--muted)}
.tan{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)}
@media(max-width:600px){.tan{grid-template-columns:1fr}}
.ab2{padding:14px 18px}
.ab2:first-child{border-right:1px solid var(--border)}
@media(max-width:600px){.ab2:first-child{border-right:none;border-bottom:1px solid var(--border)}}
.stag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:4px;margin-bottom:8px}
.stag.g{background:var(--gemini-bg);color:var(--gemini)}.stag.c{background:var(--claude-bg);color:var(--claude)}
.al2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.ab2 p{font-size:13px;line-height:1.7}
.exbar{padding:12px 18px;background:var(--bg);border-top:1px solid var(--border)}
.ev{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;border-radius:4px;margin-bottom:6px}
.ev.ok{background:var(--green-bg);color:var(--green)}.ev.ko{background:var(--red-bg);color:var(--red)}
.exbar p{font-size:12px;color:var(--muted);line-height:1.65}
.lbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:4px 20px;margin-top:18px}
.lr{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.lr:last-child{border-bottom:none}
.lnum{font-size:13px;font-weight:600;color:var(--muted);flex-shrink:0;width:18px}
.lrule{font-size:14px;font-weight:500;margin-bottom:4px}
.ldet{font-size:13px;color:var(--muted);line-height:1.65}
.ltags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.nbadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:4px;background:var(--nias-bg);color:var(--nias);font-weight:500}
.empty{text-align:center;padding:60px;color:var(--muted)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center">
    <span class="tlogo">NIAS <span>Journal</span></span>
    <span class="ttag">Auto-updates from trades.json</span>
  </div>
  <span class="tupd" id="upd">Loading...</span>
</div>

<div class="main"><div id="app"><div class="loading">Loading journal data…</div></div></div>

<script>
let D=null, activeDay=0;
const $=id=>document.getElementById(id);
const fmt=(n,d=0)=>'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d=0)=>(n>=0?'+':'-')+fmt(n,d);
const cls=n=>n>0?'pos':n<0?'neg':'';

async function load(){
  try{
    const r=await fetch('./trades.json?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    D=await r.json();
    $('upd').textContent='Updated: '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){
    $('app').innerHTML=`<div class="err"><strong>Cannot load trades.json</strong><br>${e.message}<br><br>
    If viewing locally: run <code>python3 -m http.server 8080</code> then open <a href="http://localhost:8080">localhost:8080</a></div>`;
  }
}

function render(){
  const acc=D.account, days=D.days||[];
  const totalPnl=days.reduce((s,d)=>s+(d.net_pnl||0),0);
  const winDays=days.filter(d=>d.net_pnl>0).length;
  const allT=days.flatMap(d=>d.trades||[]);
  const closed=allT.filter(t=>t.pnl!=null);
  const winT=closed.filter(t=>t.pnl>0).length;
  const totalLoss=days.reduce((s,d)=>s+Math.abs(Math.min(0,d.net_pnl||0)),0);
  const riskPct=Math.round(totalLoss/acc.max_daily_risk*100);
  let gPnl=0,cPnl=0;
  days.forEach(d=>{
    if(d.signal_source_breakdown){
      gPnl+=(d.signal_source_breakdown['Google Gemini']||0);
      cPnl+=(d.signal_source_breakdown['NIAS / Claude']||0);
    }
  });

  let h='';
  h+=`<div class="grid">
    <div class="mc"><div class="l">Capital</div><div class="v">${fmt(acc.capital)}</div></div>
    <div class="mc"><div class="l">Total P&L</div><div class="v ${cls(totalPnl)}">${sgn(totalPnl)}</div><div class="s">${(totalPnl/acc.capital*100).toFixed(2)}% of capital</div></div>
    <div class="mc"><div class="l">Win days</div><div class="v">${winDays}/${days.length}</div></div>
    <div class="mc"><div class="l">Win trades</div><div class="v">${winT}/${closed.length}</div></div>
    <div class="mc"><div class="l">Risk used</div><div class="v ${riskPct>80?'neg':riskPct>50?'amb':'pos'}">${riskPct}%</div><div class="s">of ${fmt(acc.max_daily_risk)} daily cap</div><div class="rb"><div class="rf" style="width:${Math.min(riskPct,100)}%;background:${riskPct>80?'var(--red)':riskPct>50?'var(--amber)':'var(--green)'}"></div></div></div>
  </div>`;

  h+=`<div class="src-row">
    <div class="si g"><strong>◆ Google Gemini</strong> &nbsp;${sgn(gPnl)}</div>
    <div class="si c">${cPnl!==0?`<strong>✦ NIAS / Claude</strong> &nbsp;${sgn(cPnl)}`:'<strong>✦ NIAS / Claude</strong> &nbsp;₹0 — no signals executed yet'}</div>
  </div>`;

  if(days.length>0){
    const mx=Math.max(...days.map(d=>Math.abs(d.net_pnl||0)),1);
    h+=`<div class="chart-box"><div class="ct">Daily P&L</div>
      <div class="bars">${days.map(d=>{const hh=Math.max(4,Math.abs(d.net_pnl||0)/mx*70);return`<div class="bar ${d.net_pnl>=0?'pos':'neg'}" style="height:${hh}px" title="${d.label}: ${sgn(d.net_pnl)}"></div>`;}).join('')}</div>
      <div class="blabels">${days.map(d=>`<span>${d.date.slice(5)}</span>`).join('')}</div>
    </div>`;
  }

  if(days.length>1){
    h+=`<div class="tabs">${days.map((d,i)=>`<div class="tab ${i===activeDay?'on':''}" onclick="sw(${i})">${d.label}<span class="tp ${d.net_pnl>=0?'pos':'neg'}">${sgn(d.net_pnl)}</span></div>`).join('')}</div>`;
  }

  const day=days[activeDay];
  if(!day){h+='<div class="empty">No data yet.</div>';$('app').innerHTML=h;return;}
  h+=renderDay(day,acc);
  $('app').innerHTML=h;
}

function sw(i){activeDay=i;render();}

function renderDay(day,acc){
  const ctx=day.context||{}, trades=day.trades||[], lessons=day.lessons||[];
  let h='';

  h+=`<div class="ctx">
    <strong style="font-size:12px;margin-right:4px">${day.label}</strong>
    ${ctx.vix?`<span class="cp ${ctx.vix>16?'al':'ok'}">VIX ${ctx.vix}</span>`:''}
    ${ctx.crude?`<span class="cp ${ctx.crude>100?'al':'ok'}">Crude $${ctx.crude}</span>`:''}
    ${ctx.usd_inr?`<span class="cp ${ctx.usd_inr>90?'al':'ok'}">₹${ctx.usd_inr}/USD</span>`:''}
    ${ctx.gap?`<span class="cp al">${ctx.gap}</span>`:''}
    ${(ctx.mood||[]).map(m=>`<span class="cp mo">${m}</span>`).join('')}
  </div>`;

  h+=`<div class="ds">
    <div class="dc"><div class="l">Net P&L</div><div class="v ${cls(day.net_pnl)}">${sgn(day.net_pnl||0)}</div></div>
    <div class="dc"><div class="l">Trades</div><div class="v">${trades.length}</div></div>
    <div class="dc"><div class="l">Wins</div><div class="v pos">${trades.filter(t=>t.result==='WIN').length}</div></div>
    <div class="dc"><div class="l">Losses</div><div class="v neg">${trades.filter(t=>t.result==='LOSS').length}</div></div>
    <div class="dc"><div class="l">Risk used</div><div class="v ${Math.abs(Math.min(0,day.net_pnl||0))/acc.max_daily_risk*100>80?'neg':'pos'}">${(Math.abs(Math.min(0,day.net_pnl||0))/acc.max_daily_risk*100).toFixed(1)}%</div></div>
  </div>`;

  h+=`<div class="stitle">Trades</div>`;

  trades.forEach(t=>{
    const iW=t.result==='WIN', iS=t.type==='SPREAD';
    const src=t.source==='Google Gemini'?`<span class="stag g">◆ Google Gemini</span>`:`<span class="stag c">✦ NIAS / Claude</span>`;
    h+=`<div class="tc">
      <div class="tch">
        <div class="tchl">
          <div class="tci ${iS?'sp':iW?'win':'loss'}">${iS?'⇅':iW?'↑':'↓'}</div>
          <div><div class="tcn">${t.instrument}</div><div class="tcs">${t.sector} · ${t.strategy}</div></div>
        </div>
        <div class="tcp"><div class="v ${cls(t.pnl)}">${sgn(t.pnl||0)}</div><div class="s">${iW?'Winning trade':iS?'Spread — stopped out':'Loss — SL hit'}</div></div>
      </div>`;

    if(t.simple){
      h+=`<div class="tw"><table class="lt">
        <thead><tr><th>Time</th><th>Action</th><th>Qty</th><th>Price</th><th>Value</th><th>P&L</th></tr></thead>
        <tbody>
          <tr><td class="pm">${t.entry_time}</td><td class="ab">BUY — Entry</td><td>${t.qty}</td><td>₹${t.entry.toLocaleString('en-IN',{minimumFractionDigits:2})}</td><td>₹${(t.entry*t.qty).toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td class="pm">—</td></tr>
          <tr><td class="pm">${t.exit_time}</td><td class="as">SELL — Exit</td><td>${t.qty}</td><td>₹${t.exit.toLocaleString('en-IN',{minimumFractionDigits:2})}</td><td>₹${(t.exit*t.qty).toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td class="${t.pnl>=0?'pp':'pn'}">${sgn(t.pnl||0)}</td></tr>
        </tbody></table></div>`;
    }else if(t.legs){
      h+=`<div class="tw"><table class="lt">
        <thead><tr><th>Time</th><th>Action</th><th>Strike</th><th>Qty</th><th>Open @</th><th>Close @</th><th>Leg P&L</th></tr></thead>
        <tbody>
          ${t.legs.map(l=>`<tr style="background:${l.leg_pnl>=0?'var(--green-bg)':'var(--red-bg)'}">
            <td class="pm">${l.time}</td>
            <td class="${l.action==='BUY'?'ab':'as'}">${l.action} open</td>
            <td>${l.strike}</td><td>${l.qty}</td>
            <td>₹${l.price}</td>
            <td class="pm">₹${l.close_price} @ ${l.close_time}</td>
            <td class="${l.leg_pnl>=0?'pp':'pn'}">${sgn(l.leg_pnl)}</td>
          </tr>`).join('')}
          <tr class="tot"><td colspan="6" style="text-align:right;font-size:11px;color:var(--muted);font-family:'Inter',sans-serif">Net spread P&L</td><td class="${t.pnl>=0?'pp':'pn'}">${sgn(t.pnl||0)}</td></tr>
        </tbody></table></div>`;
    }

    h+=`<div class="tan">
      <div class="ab2">${src}<div class="al2">Trade logic</div><p>${t.notes||'—'}</p></div>
      <div class="ab2">${src}<div class="al2">Execution review</div><p>${t.execution||'—'}</p></div>
    </div>
    </div>`;
  });

  if(lessons.length){
    h+=`<div class="stitle" style="margin-top:22px">Key lessons &amp; rules for tomorrow</div>
    <div class="lbox">
      ${lessons.map((l,i)=>`<div class="lr"><div class="lnum">${i+1}</div>
        <div><div class="lrule">${l.rule}</div><div class="ldet">${l.detail}</div>
        <div class="ltags">
          ${l.source==='Google Gemini'?`<span class="stag g">◆ Google Gemini</span>`:`<span class="stag c">✦ NIAS / Claude</span>`}
          ${l.implemented_in_nias?`<span class="nbadge">✓ NIAS v3 — ${l.nias_note||''}</span>`:''}
        </div></div>
      </div>`).join('')}
    </div>`;
  }

  h+=`<footer>
    <p>NIAS Trading Journal · ${day.label}<br>Signals: <strong>Google Gemini</strong> · Analytics: <strong>NIAS / Claude (Anthropic)</strong></p>
    <p style="text-align:right">Capital: ₹1,00,000 · Max daily risk: ₹10,000<br>Personal record only. Not SEBI-registered advice.</p>
  </footer>`;

  return h;
}

load();
setInterval(load,60000);
</script>
</body>
</html>
