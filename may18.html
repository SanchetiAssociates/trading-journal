<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIAS Trading Journal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');

/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:       #F5F4F0;
  --surface:  #FFFFFF;
  --surface2: #F9F8F5;
  --border:   #E3E1DA;
  --border2:  #D0CEC6;
  --text:     #1C1B18;
  --muted:    #6A6A66;
  --faint:    #9A9A96;
  --green:    #1D7A40; --green-bg: #EBF7EF; --green-b: #A8DDB8;
  --red:      #9B1F18; --red-bg:   #FCEEED; --red-b:   #F0AFAB;
  --amber:    #865200; --amber-bg: #FDF4E3; --amber-b: #E8C97A;
  --blue:     #164EA0; --blue-bg:  #EBF2FC; --blue-b:  #9DC0EF;
  --gemini:   #1A56A0; --gemini-bg:#E8F0FE; --gemini-b:#A8C4F0;
  --claude:   #7A3800; --claude-bg:#FFF0E3; --claude-b:#F0C090;
  --perp:     #5518A8; --perp-bg:  #F2ECFE; --perp-b:  #C4A0F0;
  --r:        6px;
  --rl:       10px;
  --shadow:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"] {
  --bg:#111110; --surface:#1C1C1A; --surface2:#242422; --border:#2E2E2A; --border2:#3A3A36;
  --text:#F0EFE8; --muted:#8A8A84; --faint:#5A5A56;
  --green:#3CB06A; --green-bg:#0E2A18; --green-b:#1A5030;
  --red:#D94F46;  --red-bg:#2A0E0C;   --red-b:#5A1E1A;
  --amber:#E8A830; --amber-bg:#2A1E06; --amber-b:#5A3A0A;
  --blue:#5A96E8;  --blue-bg:#0A1A34;  --blue-b:#183060;
  --gemini:#6090E0; --gemini-bg:#0A1630; --gemini-b:#183060;
  --claude:#E08040; --claude-bg:#2A1206; --claude-b:#5A2A10;
  --perp:#A070E0;   --perp-bg:#160A2A;  --perp-b:#340A60;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; line-height:1.6; min-height:100vh; transition:background .2s, color .2s; }

/* ── TOPBAR ─────────────────────────────────────────────── */
.topbar {
  position:sticky; top:0; z-index:200;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:0 20px; height:50px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow);
}
.tlogo { font-size:15px; font-weight:600; letter-spacing:-.3px; display:flex; align-items:center; gap:8px; }
.tlogo .accent { color:var(--green); }
.tpill { font-size:10px; background:var(--green-bg); color:var(--green); border:1px solid var(--green-b); padding:2px 8px; border-radius:20px; font-weight:500; letter-spacing:.5px; }
.tright { display:flex; align-items:center; gap:10px; }
.tupd { font-size:11px; color:var(--faint); font-family:'JetBrains Mono',monospace; }
.theme-btn { background:none; border:1px solid var(--border2); color:var(--muted); font-size:13px; width:30px; height:30px; border-radius:var(--r); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s; }
.theme-btn:hover { border-color:var(--border2); background:var(--surface2); }
.refresh-btn { background:none; border:1px solid var(--border2); color:var(--muted); font-size:11px; padding:4px 10px; border-radius:var(--r); cursor:pointer; font-family:'Inter',sans-serif; transition:.15s; letter-spacing:.3px; }
.refresh-btn:hover { border-color:var(--green); color:var(--green); }

/* ── LAYOUT ─────────────────────────────────────────────── */
.body-wrap { display:flex; gap:0; min-height:calc(100vh - 50px); }
.sidebar {
  width:230px; flex-shrink:0;
  background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:50px; height:calc(100vh - 50px); overflow-y:auto;
  padding:16px 14px;
}
.sidebar::-webkit-scrollbar { width:3px; }
.sidebar::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.content { flex:1; min-width:0; padding:20px 22px 80px; }
@media(max-width:768px) {
  .body-wrap { flex-direction:column; }
  .sidebar { width:100%; height:auto; position:static; border-right:none; border-bottom:1px solid var(--border); padding:12px; }
}

/* ── SIDEBAR FILTERS ────────────────────────────────────── */
.sf-group { margin-bottom:18px; }
.sf-title { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--faint); font-weight:500; margin-bottom:8px; }
.sf-chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip {
  font-size:12px; padding:4px 10px; border-radius:20px;
  border:1px solid var(--border2); background:var(--surface2);
  color:var(--muted); cursor:pointer; transition:.15s; white-space:nowrap;
  font-weight:400;
}
.chip:hover { border-color:var(--border2); background:var(--surface); color:var(--text); }
.chip.on { font-weight:500; }
.chip.on.src-all   { background:var(--text); color:var(--surface); border-color:var(--text); }
.chip.on.src-gemini   { background:var(--gemini-bg); color:var(--gemini); border-color:var(--gemini-b); }
.chip.on.src-claude   { background:var(--claude-bg); color:var(--claude); border-color:var(--claude-b); }
.chip.on.src-perplexity { background:var(--perp-bg); color:var(--perp); border-color:var(--perp-b); }
.chip.on.src-positional { background:#F0FDF4; color:#166534; border-color:#86EFAC; }
[data-theme="dark"] .chip.on.src-positional { background:#052E16; color:#4ADE80; border-color:#166534; }
.chip.on.f-all  { background:var(--text); color:var(--surface); border-color:var(--text); }
.chip.on.f-win  { background:var(--green-bg); color:var(--green); border-color:var(--green-b); }
.chip.on.f-loss { background:var(--red-bg);   color:var(--red);   border-color:var(--red-b); }
.chip.on.f-closed { background:#1C1B18; color:#F5F4F0; border-color:#1C1B18; }
[data-theme="dark"] .chip.on.f-closed { background:#F5F4F0; color:#1C1B18; border-color:#F5F4F0; }
.chip.on.f-open { background:var(--amber-bg); color:var(--amber); border-color:var(--amber-b); }
.chip.on.f-index  { background:var(--blue-bg); color:var(--blue); border-color:var(--blue-b); }
.chip.on.f-stocks { background:var(--surface); color:var(--text); border-color:var(--text); }
.chip.on.f-sector,
.chip.on.f-type,
.chip.on.f-date { background:var(--text); color:var(--surface); border-color:var(--text); }
.sf-search {
  width:100%; background:var(--surface2); border:1px solid var(--border2);
  color:var(--text); font-family:'Inter',sans-serif; font-size:12px;
  padding:7px 10px; border-radius:var(--r); outline:none; margin-bottom:18px;
  transition:.15s;
}
.sf-search:focus { border-color:var(--blue); background:var(--surface); }
.sf-search::placeholder { color:var(--faint); }
.sf-sort { width:100%; background:var(--surface2); border:1px solid var(--border2); color:var(--text); font-family:'Inter',sans-serif; font-size:12px; padding:7px 10px; border-radius:var(--r); outline:none; cursor:pointer; }
.clear-all-btn { width:100%; margin-top:4px; background:none; border:1px solid var(--red-b); color:var(--red); font-family:'Inter',sans-serif; font-size:12px; padding:7px; border-radius:var(--r); cursor:pointer; transition:.15s; letter-spacing:.3px; }
.clear-all-btn:hover { background:var(--red-bg); }
.active-chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
.active-chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; padding:3px 8px; border-radius:20px; border:1px solid var(--border2); background:var(--text); color:var(--surface); cursor:pointer; }
.active-chip .x { font-size:13px; line-height:1; opacity:.6; }
.active-chip:hover .x { opacity:1; }
.results-count { font-size:12px; color:var(--muted); margin-bottom:14px; }
.results-count strong { color:var(--text); }

/* ── STAT CARDS ─────────────────────────────────────────── */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
.sc { background:var(--surface); border:1px solid var(--border); border-radius:var(--rl); padding:12px 14px; }
.sc .l { font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.sc .v { font-size:19px; font-weight:600; font-family:'JetBrains Mono',monospace; letter-spacing:-1px; }
.sc .s { font-size:11px; color:var(--muted); margin-top:2px; }
.sc .v.pos { color:var(--green); } .sc .v.neg { color:var(--red); } .sc .v.amb { color:var(--amber); }
.rbar { background:var(--bg); border-radius:3px; height:3px; margin-top:6px; overflow:hidden; }
.rfill { height:100%; border-radius:3px; transition:.4s; }

/* ── CHART ──────────────────────────────────────────────── */
.chart-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--rl); padding:18px 20px; margin-bottom:18px; }
.chart-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.chart-head h3 { font-size:13px; font-weight:500; }
.chart-tabs { display:flex; gap:4px; }
.ctab { font-size:11px; padding:3px 10px; border:1px solid var(--border2); border-radius:20px; cursor:pointer; background:none; font-family:'Inter',sans-serif; color:var(--muted); transition:.15s; }
.ctab.on { background:var(--text); color:var(--surface); border-color:var(--text); }
.chart-canvas-wrap { position:relative; height:130px; }
.no-chart { text-align:center; padding:40px; color:var(--faint); font-size:13px; }

/* ── SOURCE BREAKDOWN ───────────────────────────────────── */
.src-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-bottom:18px; }
.src-card { border-radius:var(--r); padding:12px 14px; border:1px solid; }
.src-card.g { background:var(--gemini-bg); border-color:var(--gemini-b); }
.src-card.c { background:var(--claude-bg); border-color:var(--claude-b); }
.src-card.p { background:var(--perp-bg); border-color:var(--perp-b); }
.src-card .sl { font-size:11px; font-weight:500; margin-bottom:4px; }
.src-card.g .sl { color:var(--gemini); } .src-card.c .sl { color:var(--claude); } .src-card.p .sl { color:var(--perp); }
.src-card .sv { font-size:16px; font-weight:600; font-family:'JetBrains Mono',monospace; }
.src-card .ss { font-size:11px; color:var(--muted); margin-top:2px; }

/* ── TRADE CARDS ────────────────────────────────────────── */
.trades-wrap { display:flex; flex-direction:column; gap:12px; }
.tc {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--rl); overflow:hidden;
  transition:box-shadow .15s, transform .15s;
}
.tc:hover { box-shadow:var(--shadow); }
.tc-head { display:flex; align-items:flex-start; justify-content:space-between; padding:14px 18px 12px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
.tcl { display:flex; align-items:center; gap:11px; }
.tci { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0; }
.tci.win { background:var(--green-bg); color:var(--green); }
.tci.loss { background:var(--red-bg); color:var(--red); }
.tci.spread { background:var(--amber-bg); color:var(--amber); }
.tc-name { font-size:14px; font-weight:600; }
.tc-sub { font-size:11px; color:var(--muted); margin-top:1px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tc-pnl .v { font-size:19px; font-weight:600; font-family:'JetBrains Mono',monospace; text-align:right; }
.tc-pnl .v.pos { color:var(--green); } .tc-pnl .v.neg { color:var(--red); }
.tc-pnl .s { font-size:11px; color:var(--muted); text-align:right; }
.tc-expand { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:0 4px; line-height:1; margin-left:8px; transition:.15s; }
.tc-expand:hover { color:var(--text); }
.tc-body { display:none; }
.tc-body.open { display:block; }
.badge { font-size:10px; padding:2px 7px; border-radius:20px; font-weight:500; border:1px solid; white-space:nowrap; }
.badge.gemini { background:var(--gemini-bg); color:var(--gemini); border-color:var(--gemini-b); }
.badge.claude  { background:var(--claude-bg); color:var(--claude); border-color:var(--claude-b); }
.badge.perp    { background:var(--perp-bg);   color:var(--perp);   border-color:var(--perp-b); }
.badge.win  { background:var(--green-bg); color:var(--green); border-color:var(--green-b); }
.badge.loss { background:var(--red-bg);   color:var(--red);   border-color:var(--red-b); }
.badge.open { background:var(--amber-bg); color:var(--amber); border-color:var(--amber-b); }
.badge.index  { background:var(--blue-bg); color:var(--blue); border-color:var(--blue-b); }
.badge.stocks { background:var(--surface2); color:var(--muted); border-color:var(--border2); }

/* LEGS TABLE */
.legs-wrap { overflow-x:auto; }
table.lt { width:100%; border-collapse:collapse; font-size:12px; }
table.lt th { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--faint); font-weight:500; padding:7px 14px; text-align:left; background:var(--surface2); border-bottom:1px solid var(--border); }
table.lt td { padding:9px 14px; border-bottom:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:12px; }
table.lt tr:last-child td { border-bottom:none; }
table.lt tr.tot td { border-top:2px solid var(--border2); font-weight:600; background:var(--surface2); }
.ab { color:var(--green); font-weight:600; } .as { color:var(--red); font-weight:600; }
.pp { color:var(--green); font-weight:600; } .pn { color:var(--red); font-weight:600; } .pm { color:var(--muted); }
.analysis-grid { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--border); }
@media(max-width:600px) { .analysis-grid { grid-template-columns:1fr; } }
.ablock { padding:14px 18px; }
.ablock:first-child { border-right:1px solid var(--border); }
@media(max-width:600px) { .ablock:first-child { border-right:none; border-bottom:1px solid var(--border); } }
.albl { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--faint); margin-bottom:6px; font-weight:500; }
.ablock p { font-size:13px; color:var(--text); line-height:1.7; }
.exec-bar { padding:12px 18px; background:var(--surface2); border-top:1px solid var(--border); }
.ev { display:inline-block; font-size:11px; font-weight:500; padding:3px 10px; border-radius:4px; margin-bottom:5px; }
.ev.ok { background:var(--green-bg); color:var(--green); } .ev.ko { background:var(--red-bg); color:var(--red); }
.exec-bar p { font-size:12px; color:var(--muted); line-height:1.65; }

/* LESSONS */
.section-title { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--muted); font-weight:500; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.lbox { background:var(--surface); border:1px solid var(--border); border-radius:var(--rl); padding:4px 18px; margin-bottom:20px; }
.lr { display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
.lr:last-child { border-bottom:none; }
.lnum { font-size:13px; font-weight:600; color:var(--faint); flex-shrink:0; width:18px; }
.lrule { font-size:13px; font-weight:500; margin-bottom:3px; }
.ldet { font-size:12px; color:var(--muted); line-height:1.65; }
.ltags { margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; }
.nbadge { display:inline-flex; align-items:center; font-size:11px; padding:2px 8px; border-radius:4px; background:#F2ECFE; color:#5518A8; font-weight:500; border:1px solid #C4A0F0; }
[data-theme="dark"] .nbadge { background:#160A2A; color:#A070E0; border-color:#340A60; }

/* EMPTY */
.empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-state .big { font-size:40px; margin-bottom:12px; }
.empty-state p { font-size:14px; }

/* CONTEXT PILLS */
.ctx-strip { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.cp { font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--border2); background:var(--surface2); }
.cp.al { background:var(--red-bg); border-color:var(--red-b); color:var(--red); }
.cp.mo { background:var(--amber-bg); border-color:var(--amber-b); color:var(--amber); }
.cp.ok { background:var(--green-bg); border-color:var(--green-b); color:var(--green); }

/* SCROLLBAR */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

/* FADE IN */
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.tc { animation:fadeIn .2s ease; }

/* FOOTER */
.footer { padding-top:20px; border-top:1px solid var(--border); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:11px; color:var(--faint); line-height:1.6; margin-top:24px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div class="tlogo">NIAS <span class="accent">Journal</span></div>
    <span class="tpill">LIVE</span>
  </div>
  <div class="tright">
    <span class="tupd" id="upd">—</span>
    <button class="refresh-btn" onclick="load()">↻ Refresh</button>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle dark mode">◑</button>
  </div>
</div>

<div class="body-wrap">

  <!-- SIDEBAR FILTERS -->
  <aside class="sidebar" id="sidebar">
    <input class="sf-search" id="search-inp" placeholder="🔍  Search instrument, sector…" oninput="applyFilters()">

    <div class="sf-group">
      <div class="sf-title">Signal source</div>
      <div class="sf-chips" id="chips-src">
        <span class="chip on src-all"  data-f="src" data-v="all">All</span>
        <span class="chip src-gemini"     data-f="src" data-v="gemini">◆ Gemini</span>
        <span class="chip src-claude"     data-f="src" data-v="claude">✦ Claude</span>
        <span class="chip src-perplexity" data-f="src" data-v="perplexity">⬡ Perplexity</span>
        <span class="chip src-positional" data-f="src" data-v="positional">⬛ Positional</span>
      </div>
    </div>

    <div class="sf-group">
      <div class="sf-title">Result</div>
      <div class="sf-chips" id="chips-result">
        <span class="chip on f-all"  data-f="result" data-v="all">All</span>
        <span class="chip f-win"     data-f="result" data-v="win">Win</span>
        <span class="chip f-loss"    data-f="result" data-v="loss">Loss</span>
        <span class="chip f-closed"  data-f="result" data-v="closed">Closed</span>
        <span class="chip f-open"    data-f="result" data-v="open">Open</span>
      </div>
    </div>

    <div class="sf-group">
      <div class="sf-title">Instrument type</div>
      <div class="sf-chips" id="chips-type">
        <span class="chip on f-all"    data-f="type" data-v="all">All</span>
        <span class="chip f-index"     data-f="type" data-v="index">Index</span>
        <span class="chip f-stocks"    data-f="type" data-v="stocks">Stocks</span>
      </div>
    </div>

    <div class="sf-group">
      <div class="sf-title">Trade style</div>
      <div class="sf-chips" id="chips-tradetype">
        <span class="chip on f-all"    data-f="tradetype" data-v="all">All</span>
        <span class="chip f-type"      data-f="tradetype" data-v="equity">Equity</span>
        <span class="chip f-type"      data-f="tradetype" data-v="spread">Spread</span>
        <span class="chip f-type"      data-f="tradetype" data-v="ce">Call (CE)</span>
        <span class="chip f-type"      data-f="tradetype" data-v="pe">Put (PE)</span>
      </div>
    </div>

    <div class="sf-group" id="sector-group">
      <div class="sf-title">Sector</div>
      <div class="sf-chips" id="chips-sector">
        <span class="chip on f-all" data-f="sector" data-v="all">All</span>
      </div>
    </div>

    <div class="sf-group" id="date-group">
      <div class="sf-title">Date</div>
      <div class="sf-chips" id="chips-date">
        <span class="chip on f-date" data-f="date" data-v="all">All dates</span>
      </div>
    </div>

    <div class="sf-group">
      <div class="sf-title">Sort by</div>
      <select class="sf-sort" id="sort-sel" onchange="applyFilters()">
        <option value="date-desc">Date — newest first</option>
        <option value="date-asc">Date — oldest first</option>
        <option value="pnl-desc">P&L — best first</option>
        <option value="pnl-asc">P&L — worst first</option>
        <option value="instrument">Instrument A–Z</option>
      </select>
    </div>

    <button class="clear-all-btn" onclick="clearFilters()">✕  Clear all filters</button>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content">
    <div id="app"><div style="text-align:center;padding:80px;color:var(--muted)">Loading journal…</div></div>
  </main>

</div>

<script>
/* ── STATE ─────────────────────────────────────────────── */
let D = null;
let allTrades = [];
let filters = { src:'all', result:'all', type:'all', tradetype:'all', sector:'all', date:'all', search:'' };
let pnlChart = null;
let expandedCards = new Set();
let darkMode = localStorage.getItem('nias-dark') === '1';

/* ── THEME ─────────────────────────────────────────────── */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  localStorage.setItem('nias-dark', darkMode ? '1' : '0');
}
function toggleTheme() { darkMode = !darkMode; applyTheme(); rebuildCharts(); }
applyTheme();

/* ── CHIP CLICK ─────────────────────────────────────────── */
document.querySelectorAll('.chip[data-f]').forEach(el => {
  el.addEventListener('click', () => {
    const f = el.dataset.f, v = el.dataset.v;
    filters[f] = v;
    document.querySelectorAll(`.chip[data-f="${f}"]`).forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    applyFilters();
  });
});

function setChip(f, v) {
  filters[f] = v;
  document.querySelectorAll(`.chip[data-f="${f}"]`).forEach(c => {
    c.classList.toggle('on', c.dataset.v === v);
  });
}

function clearFilters() {
  ['src','result','type','tradetype','sector','date'].forEach(f => setChip(f,'all'));
  document.getElementById('search-inp').value = '';
  filters.search = '';
  applyFilters();
}

/* ── DATA LOAD ──────────────────────────────────────────── */
async function load() {
  try {
    const r = await fetch('./trades.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
    document.getElementById('upd').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    buildSidebarData();
    applyFilters();
  } catch(e) {
    document.getElementById('app').innerHTML =
      `<div style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--rl);padding:20px;color:var(--red)">
        <strong>Cannot load trades.json</strong> — ${e.message}<br><br>
        If running locally: <code>python3 -m http.server 8080</code>
      </div>`;
  }
}

/* ── BUILD SIDEBAR DYNAMIC FILTERS ─────────────────────── */
function buildSidebarData() {
  if (!D) return;
  allTrades = D.days.flatMap(d =>
    (d.trades || []).map(t => ({...t, day: d.date, dayLabel: d.label, context: d.context}))
  );

  // Sectors
  const sectors = [...new Set(allTrades.map(t => t.sector).filter(Boolean))];
  const sc = document.getElementById('chips-sector');
  sc.innerHTML = `<span class="chip on f-all" data-f="sector" data-v="all">All</span>` +
    sectors.map(s => `<span class="chip f-sector" data-f="sector" data-v="${s.toLowerCase()}">${s}</span>`).join('');
  sc.querySelectorAll('.chip[data-f]').forEach(el => {
    el.addEventListener('click', () => { setChip('sector', el.dataset.v); applyFilters(); });
  });

  // Dates
  const dates = [...new Set(allTrades.map(t => t.day))].sort().reverse();
  const dc = document.getElementById('chips-date');
  dc.innerHTML = `<span class="chip on f-date" data-f="date" data-v="all">All dates</span>` +
    dates.map(d => `<span class="chip f-date" data-f="date" data-v="${d}">${d.slice(5)}</span>`).join('');
  dc.querySelectorAll('.chip[data-f]').forEach(el => {
    el.addEventListener('click', () => { setChip('date', el.dataset.v); applyFilters(); });
  });
}

/* ── FILTER LOGIC ───────────────────────────────────────── */
function getFiltered() {
  if (!allTrades.length) return [];
  filters.search = document.getElementById('search-inp').value.trim().toLowerCase();

  return allTrades.filter(t => {
    // source
    if (filters.src !== 'all') {
      const s = (t.source || '').toLowerCase();
      if (filters.src === 'gemini'     && !s.includes('gemini'))     return false;
      if (filters.src === 'claude'     && !s.includes('claude') && !s.includes('nias')) return false;
      if (filters.src === 'perplexity' && !s.includes('perplexity')) return false;
      if (filters.src === 'positional' && !s.includes('positional') && !s.includes('nrml')) return false;
    }
    // result
    if (filters.result !== 'all') {
      if (filters.result === 'win'    && t.result !== 'WIN')  return false;
      if (filters.result === 'loss'   && t.result !== 'LOSS') return false;
      if (filters.result === 'open'   && t.result !== 'OPEN') return false;
      if (filters.result === 'closed' && t.result === 'OPEN') return false;
    }
    // instrument type
    if (filters.type !== 'all') {
      const idx = ['NIFTY','BANKNIFTY','SENSEX'].some(x => (t.instrument||'').toUpperCase().includes(x));
      if (filters.type === 'index'  && !idx) return false;
      if (filters.type === 'stocks' && idx)  return false;
    }
    // trade style
    if (filters.tradetype !== 'all') {
      const tp = (t.type || '').toUpperCase();
      if (filters.tradetype === 'equity' && tp !== 'BUY' && tp !== 'SELL') return false;
      if (filters.tradetype === 'spread' && tp !== 'SPREAD') return false;
      if (filters.tradetype === 'ce' && !tp.includes('CE')) return false;
      if (filters.tradetype === 'pe' && !tp.includes('PE')) return false;
    }
    // sector
    if (filters.sector !== 'all') {
      if ((t.sector || '').toLowerCase() !== filters.sector) return false;
    }
    // date
    if (filters.date !== 'all' && t.day !== filters.date) return false;
    // search
    if (filters.search) {
      const blob = [t.instrument, t.sector, t.strategy, t.notes, t.source, t.day].join(' ').toLowerCase();
      if (!blob.includes(filters.search)) return false;
    }
    return true;
  });
}

function getSorted(trades) {
  const s = document.getElementById('sort-sel').value;
  return [...trades].sort((a, b) => {
    if (s === 'date-desc')   return b.day.localeCompare(a.day);
    if (s === 'date-asc')    return a.day.localeCompare(b.day);
    if (s === 'pnl-desc')    return (b.pnl || 0) - (a.pnl || 0);
    if (s === 'pnl-asc')     return (a.pnl || 0) - (b.pnl || 0);
    if (s === 'instrument')  return (a.instrument || '').localeCompare(b.instrument || '');
    return 0;
  });
}

/* ── RENDER ─────────────────────────────────────────────── */
function applyFilters() {
  if (!D) return;
  const filtered = getFiltered();
  const sorted   = getSorted(filtered);
  renderContent(sorted);
}

function fmt(n, d=0) {
  return '₹' + Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function sgn(n, d=0) { return (n >= 0 ? '+' : '−') + fmt(n, d); }
function cls(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : ''; }
function srcBadge(src) {
  const s = (src || '').toLowerCase();
  if (s.includes('gemini'))     return `<span class="badge gemini">◆ Gemini</span>`;
  if (s.includes('claude') || s.includes('nias')) return `<span class="badge claude">✦ Claude</span>`;
  if (s.includes('perplexity')) return `<span class="badge perp">⬡ Perplexity</span>`;
  if (s.includes('positional') || s.includes('nrml')) return `<span class="badge" style="background:#F0FDF4;color:#166534;border-color:#86EFAC">⬛ Positional</span>`;
  return `<span class="badge">${src}</span>`;
}

function renderContent(trades) {
  const totalPnl = trades.reduce((s, t) => s + (t.pnl || 0), 0);
  const wins     = trades.filter(t => t.result === 'WIN').length;
  const losses   = trades.filter(t => t.result === 'LOSS').length;
  const maxRisk  = D.account.max_daily_risk;
  const totalLoss= trades.reduce((s, t) => s + Math.abs(Math.min(0, t.pnl || 0)), 0);
  const riskPct  = Math.min(100, Math.round(totalLoss / maxRisk * 100));

  // Source P&L breakdown
  const srcPnl = {};
  trades.forEach(t => {
    const key = (t.source || 'Unknown').trim();
    srcPnl[key] = (srcPnl[key] || 0) + (t.pnl || 0);
  });

  // Active filters chips
  const activeList = [];
  const labels = { src:{gemini:'◆ Gemini',claude:'✦ Claude',perplexity:'⬡ Perplexity'}, result:{win:'Win',loss:'Loss',open:'Open'}, type:{index:'Index',stocks:'Stocks'}, tradetype:{equity:'Equity',spread:'Spread',ce:'Call CE',pe:'Put PE'} };
  ['src','result','type','tradetype'].forEach(f => {
    if (filters[f] !== 'all') activeList.push({f, v:filters[f], label:(labels[f]||{})[filters[f]] || filters[f]});
  });
  if (filters.sector !== 'all') activeList.push({f:'sector', v:filters.sector, label:filters.sector});
  if (filters.date   !== 'all') activeList.push({f:'date',   v:filters.date,   label:filters.date.slice(5)});
  if (filters.search) activeList.push({f:'search', v:'', label:`"${filters.search}"`});

  let h = '';

  // Active chips
  if (activeList.length) {
    h += `<div class="active-chips">
      ${activeList.map(a => `<span class="active-chip" onclick="clearOne('${a.f}')">${a.label} <span class="x">×</span></span>`).join('')}
    </div>`;
  }
  h += `<div class="results-count"><strong>${trades.length}</strong> trade${trades.length!==1?'s':''} ${activeList.length?'matching filters':'total'}</div>`;

  // Stats
  h += `<div class="stats">
    <div class="sc"><div class="l">Filtered P&L</div><div class="v ${cls(totalPnl)}">${sgn(totalPnl)}</div></div>
    <div class="sc"><div class="l">Wins</div><div class="v pos">${wins}</div></div>
    <div class="sc"><div class="l">Losses</div><div class="v neg">${losses}</div></div>
    <div class="sc"><div class="l">Win rate</div><div class="v ${wins/(wins+losses||1)>=.5?'pos':'neg'}">${trades.length?Math.round(wins/trades.length*100):0}%</div></div>
    <div class="sc"><div class="l">Risk used</div><div class="v ${riskPct>80?'neg':riskPct>50?'amb':'pos'}">${riskPct}%</div><div class="rbar"><div class="rfill" style="width:${riskPct}%;background:${riskPct>80?'var(--red)':riskPct>50?'var(--amber)':'var(--green)'}"></div></div></div>
  </div>`;

  // Source breakdown cards
  const srcKeys = Object.keys(srcPnl);
  if (srcKeys.length) {
    h += `<div class="src-grid">`;
    srcKeys.forEach(k => {
      const pnl = srcPnl[k];
      const kl  = k.toLowerCase();
      const cls2 = kl.includes('gemini')?'g': kl.includes('claude')||kl.includes('nias')?'c': kl.includes('perp')?'p':'g';
      const ct  = trades.filter(t=>(t.source||'').trim()===k).length;
      h += `<div class="src-card ${cls2}"><div class="sl">${k}</div><div class="sv ${cls(pnl)}">${sgn(pnl)}</div><div class="ss">${ct} trade${ct!==1?'s':''}</div></div>`;
    });
    h += `</div>`;
  }

  // Chart
  h += `<div class="chart-box">
    <div class="chart-head">
      <h3>P&L over time</h3>
      <div class="chart-tabs">
        <button class="ctab on" onclick="switchChart('pnl',this)">P&L</button>
        <button class="ctab" onclick="switchChart('cumulative',this)">Cumulative</button>
      </div>
    </div>
    <div class="chart-canvas-wrap" id="chart-wrap">
      <canvas id="pnl-chart" role="img" aria-label="P&L bar chart for filtered trades"></canvas>
    </div>
  </div>`;

  // Trades
  if (!trades.length) {
    h += `<div class="empty-state"><div class="big">🔍</div><p>No trades match the current filters.<br>Try clearing some filters.</p></div>`;
  } else {
    h += `<div class="section-title" style="margin-bottom:12px">Trade log</div><div class="trades-wrap">`;
    trades.forEach(t => { h += renderTradeCard(t); });
    h += `</div>`;
  }

  // Lessons (from filtered days)
  const daySet = new Set(trades.map(t => t.day));
  const lessons = D.days.filter(d => filters.date === 'all' || daySet.has(d.date)).flatMap(d => (d.lessons||[]).map(l => ({...l, date:d.date})));
  if (lessons.length) {
    h += `<div class="section-title" style="margin-top:24px">Lessons & rules</div>
    <div class="lbox">
      ${lessons.map((l,i) => `<div class="lr"><div class="lnum">${i+1}</div>
        <div><div class="lrule">${l.rule}</div><div class="ldet">${l.detail}</div>
        <div class="ltags">
          ${srcBadge(l.source)}
          ${l.implemented_in_nias ? `<span class="nbadge">✓ In NIAS v3</span>` : ''}
        </div></div>
      </div>`).join('')}
    </div>`;
  }

  h += `<div class="footer"><p>NIAS Trading Journal · Auto-loaded from trades.json</p><p style="text-align:right">Capital: ₹1,00,000 · Personal record only</p></div>`;

  document.getElementById('app').innerHTML = h;
  rebuildCharts(trades);
  restoreExpanded();
}

function renderTradeCard(t) {
  const iW = t.result === 'WIN', iS = t.type === 'SPREAD';
  const isIdx = ['NIFTY','BANKNIFTY','SENSEX'].some(x => (t.instrument||'').toUpperCase().includes(x));
  const exp = expandedCards.has(t.id) ? 'open' : '';

  return `<div class="tc">
    <div class="tc-head">
      <div class="tcl">
        <div class="tci ${iS?'spread':iW?'win':'loss'}">${iS?'⇅':iW?'↑':'↓'}</div>
        <div>
          <div class="tc-name">${t.instrument}</div>
          <div class="tc-sub">
            ${srcBadge(t.source)}
            <span class="badge ${iW?'win':'loss'}">${t.result||'—'}</span>
            <span class="badge ${isIdx?'index':'stocks'}">${isIdx?'Index':'Stock'}</span>
            ${t.sector?`<span style="font-size:11px;color:var(--faint)">${t.sector}</span>`:''}
            <span style="font-size:11px;color:var(--faint)">${t.dayLabel||t.day}</span>
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="tc-pnl">
          <div class="v ${cls(t.pnl||0)}">${sgn(t.pnl||0)}</div>
          <div class="s">${t.strategy||''}</div>
        </div>
        <button class="tc-expand" onclick="toggleExpand(${t.id})" title="Expand">${exp?'▲':'▼'}</button>
      </div>
    </div>
    <div class="tc-body ${exp}" id="tc-${t.id}">
      ${renderTradeBody(t)}
    </div>
  </div>`;
}

function renderTradeBody(t) {
  let h = '';
  // Legs table
  if (t.simple) {
    h += `<div class="legs-wrap"><table class="lt">
      <thead><tr><th>Time</th><th>Action</th><th>Qty</th><th>Price</th><th>Value</th><th>P&L</th></tr></thead>
      <tbody>
        <tr><td class="pm">${t.entry_time||'—'}</td><td class="ab">BUY — Entry</td><td>${t.qty}</td><td>₹${(t.entry||0).toLocaleString('en-IN',{minimumFractionDigits:2})}</td><td>₹${((t.entry||0)*(t.qty||0)).toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td class="pm">—</td></tr>
        <tr><td class="pm">${t.exit_time||'—'}</td><td class="as">SELL — Exit</td><td>${t.qty}</td><td>₹${(t.exit||0).toLocaleString('en-IN',{minimumFractionDigits:2})}</td><td>₹${((t.exit||0)*(t.qty||0)).toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td class="${(t.pnl||0)>=0?'pp':'pn'}">${sgn(t.pnl||0)}</td></tr>
      </tbody></table></div>`;
  } else if (t.legs) {
    h += `<div class="legs-wrap"><table class="lt">
      <thead><tr><th>Time</th><th>Action</th><th>Strike</th><th>Qty</th><th>Open @</th><th>Close @</th><th>Leg P&L</th></tr></thead>
      <tbody>
        ${t.legs.map(l => `<tr style="background:${l.leg_pnl>=0?'var(--green-bg)':'var(--red-bg)'}">
          <td class="pm">${l.time}</td><td class="${l.action==='BUY'?'ab':'as'}">${l.action}</td>
          <td>${l.strike}</td><td>${l.qty}</td>
          <td>₹${l.price}</td><td class="pm">₹${l.close_price} @ ${l.close_time}</td>
          <td class="${l.leg_pnl>=0?'pp':'pn'}">${sgn(l.leg_pnl)}</td>
        </tr>`).join('')}
        <tr class="tot"><td colspan="6" style="text-align:right;font-size:11px;color:var(--faint);font-family:'Inter',sans-serif">Net spread P&L</td><td class="${(t.pnl||0)>=0?'pp':'pn'}">${sgn(t.pnl||0)}</td></tr>
      </tbody></table></div>`;
  }
  // Analysis
  const src = srcBadge(t.source);
  h += `<div class="analysis-grid">
    <div class="ablock">${src}<div class="albl">Trade logic</div><p>${t.notes||'—'}</p></div>
    <div class="ablock">${src}<div class="albl">Execution review</div><p>${t.execution||'—'}</p></div>
  </div>`;
  return h;
}

/* ── EXPAND/COLLAPSE ────────────────────────────────────── */
function toggleExpand(id) {
  if (expandedCards.has(id)) expandedCards.delete(id); else expandedCards.add(id);
  applyFilters();
}
function restoreExpanded() {}

function clearOne(f) {
  if (f === 'search') { document.getElementById('search-inp').value = ''; filters.search = ''; }
  else setChip(f, 'all');
  applyFilters();
}

/* ── CHARTS ─────────────────────────────────────────────── */
let chartMode = 'pnl';

function switchChart(mode, btn) {
  chartMode = mode;
  document.querySelectorAll('.ctab').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  const trades = getSorted(getFiltered());
  rebuildCharts(trades);
}

function rebuildCharts(trades) {
  if (!trades) trades = getSorted(getFiltered());
  const canvas = document.getElementById('pnl-chart');
  if (!canvas) return;
  if (pnlChart) { pnlChart.destroy(); pnlChart = null; }
  if (!trades.length) return;

  // Group by day
  const dayMap = {};
  trades.forEach(t => {
    if (!dayMap[t.day]) dayMap[t.day] = { pnl:0, label:t.dayLabel||t.day.slice(5) };
    dayMap[t.day].pnl += (t.pnl || 0);
  });
  const days = Object.keys(dayMap).sort();
  const pnls = days.map(d => dayMap[d].pnl);
  const labels = days.map(d => dayMap[d].label);

  let data, colors, chartType = 'bar';
  if (chartMode === 'cumulative') {
    let running = 0;
    data = pnls.map(p => { running += p; return Math.round(running); });
    colors = data.map(v => v >= 0 ? '#1D7A40' : '#9B1F18');
    chartType = 'line';
  } else {
    data = pnls.map(v => Math.round(v));
    colors = data.map(v => v >= 0 ? '#1D7A40' : '#9B1F18');
  }

  const ctx = canvas.getContext('2d');
  pnlChart = new Chart(ctx, {
    type: chartType,
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: chartMode === 'cumulative' ? 'rgba(29,122,64,.15)' : colors,
        borderColor: colors,
        borderWidth: chartMode === 'cumulative' ? 2 : 1,
        borderRadius: chartMode === 'bar' ? 4 : 0,
        fill: chartMode === 'cumulative',
        tension: .3,
        pointBackgroundColor: colors,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend:{ display:false }, tooltip:{ callbacks:{ label: ctx => (ctx.parsed.y>=0?'+':'')+'₹'+Math.abs(ctx.parsed.y).toLocaleString('en-IN') } } },
      scales: {
        x: { ticks:{ color:'#6A6A66', font:{size:11} }, grid:{ display:false } },
        y: { ticks:{ color:'#6A6A66', font:{size:11}, callback: v => (v>=0?'+':'')+'₹'+Math.abs(v).toLocaleString('en-IN') }, grid:{ color: darkMode?'rgba(255,255,255,.06)':'rgba(0,0,0,.05)' } }
      }
    }
  });
}

/* ── BOOT ───────────────────────────────────────────────── */
load();
setInterval(load, 60000);
</script>
</body>
</html>
